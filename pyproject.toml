[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-cv-production-pipeline"
version = "0.1.0"
description = "Clean-room industrial computer vision showcase: segmentation, ROI logic, temporal events, and deployment adapters."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
